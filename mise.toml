[tools]
zig = "0.17.1"
actionlint = "1.7.12"
lefthook = "2.2.2"

[tasks.build]
description = "実行ファイルをビルドする"
run = "zig build"

[tasks.run]
description = "実行ファイルを起動する"
run = "zig build run"

[tasks.test]
description = "テストを実行する"
run = "zig build test"

[tasks.fmt]
description = "Zigファイルを整形する"
run = "zig fmt build.zig build.zig.zon src"

[tasks."fmt:check"]
description = "Zigファイルの整形を検査する"
run = "zig fmt --check build.zig build.zig.zon src"

[tasks."lint:workflows"]
description = "GitHub Actionsの全ワークフローを検査する"
run = "actionlint"

[tasks.check]
description = "整形・ワークフロー・ビルド・テストを確認する"
depends = ["fmt:check", "lint:workflows", "build", "test"]
