name: Distribution acceptance

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      # パス・shell構文を含む不正タグは、ビルド前に拒否する。
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/package_release.py validate-tag "$RELEASE_TAG"

      - name: Export target matrix
        id: targets
        run: python3 scripts/package_release.py targets --github-output "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Set up mise and project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Build one release target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          python3 scripts/package_release.py build-target
          --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
          --output .local/release-target

      # build用の中間出力は含めず、検証済みbinaryと有限metadataだけを渡す。
      - name: Upload target artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            .local/release-target/zigurui
            .local/release-target/target.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tagged packaging script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Download target artifacts separately
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-target-*
          merge-multiple: false
          path: .local/release-targets

      - name: Validate all targets and package release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 scripts/package_release.py aggregate
          --tag "$RELEASE_TAG" --inputs .local/release-targets
          --output .local/release-assets

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            .local/release-assets/*.tar.gz
            .local/release-assets/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  acceptance:
    needs: aggregate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout acceptance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Download final release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .local/release-assets

      - name: Download published alpha.4 for migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download v0.1.0-alpha.4 --repo "$GITHUB_REPOSITORY"
          --dir .local/previous-release

      - name: Test final archives on native OS and CPU
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          python3 scripts/test-release-acceptance.py --tag "$RELEASE_TAG"
          --target "$RELEASE_TARGET" --directory .local/release-assets
          --previous .local/previous-release --output .local/release-acceptance
