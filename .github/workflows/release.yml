name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate release tag before building
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py validate-tag "$RELEASE_TAG"
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Check source and packaging
        run: |
          mise run check
          python3 scripts/test-ci-conditions.py
          python3 scripts/test-relevance-oracle.py
          python3 scripts/test-package-release.py
          python3 scripts/test-install.py

  distribution:
    needs: check
    uses: ./.github/workflows/distribution.yml
    with:
      tag: ${{ github.ref_name }}

  security:
    uses: ./.github/workflows/security.yml

  publish:
    needs: [distribution, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout tagged validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .local/release-assets

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory .local/release-assets
          # 検証済みタグから有限の引数だけを受け取る。
          release_options=$(python3 scripts/package_release.py release-flags "$RELEASE_TAG")
          read -r -a release_flags <<< "$release_options"
          gh release create "$RELEASE_TAG" \
            .local/release-assets/*.tar.gz .local/release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${release_flags[@]}" \
            --title "$RELEASE_TAG" --generate-notes
